[workspace]
resolver = "2"
members = ["crates/platea-naming", "crates/platea-playback", "crates/platea-server"]

[workspace.package]
version = "0.1.39"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
once_cell = "1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
