[package]
name = "platea-server"
description = "Platea: open source media server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "platea"
path = "src/main.rs"

[dependencies]
platea-naming = { path = "../platea-naming" }
platea-playback = { path = "../platea-playback" }

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
axum = { version = "0.8", features = ["ws", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "set-header", "limit", "fs"] }
http-body-util = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
once_cell.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
schemars = { version = "0.8", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
mime_guess = "2"
libc = "0.2"
urlencoding = "2"
roxmltree = "0.20"
notify = { version = "8", default-features = false }
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
tempfile = "3"
