# Platea: server e web UI.
#   docker compose up -d --build
# Web UI su http://localhost:8080, API e Infuse su http://localhost:8096.
# Il codice di primo avvio è nei log:  docker compose logs server | grep -i codice
# Tunnel Cloudflare (facoltativo): CLOUDFLARE_TUNNEL_TOKEN e COMPOSE_PROFILES=tunnel in .env.

services:
  server:
    build: ./Server
    image: platea-server:latest
    container_name: platea-server
    restart: unless-stopped
    ports:
      - "${PLATEA_SERVER_PORT:-8096}:8096"
    environment:
      PLATEA_DATA_DIR: /data
      PLATEA_CACHE_DIR: /cache
      PLATEA_TRANSCODE_DIR: /transcode
      PLATEA_LOG: ${PLATEA_LOG:-info}
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - ./data:/data
      - ./cache:/cache
      - ./transcode:/transcode
      # Le cartelle dei media, sempre in sola lettura (:ro). rslave: il container vede anche un mount
      # rclone fatto dopo l'avvio. Aggiungi una riga per ogni cartella: cartella dell'host → percorso nel
      # container. Sotto /media il selettore delle cartelle in Amministrazione → Librerie le trova subito.
      - ${MEDIA_DIR:-./media}:/media:ro,rslave
      # - /mnt/jottamio:/media/jottamio:ro,rslave
      # - /mnt/nas/Serie:/media/serie:ro,rslave
    # Transcodifiche brevi e frequenti: i segmenti possono stare in RAM.
    # tmpfs:
    #   - /transcode:size=4g
    # GPU Intel o AMD: togliere il commento
    # devices:
    #   - /dev/dri:/dev/dri
    # GPU NVIDIA: togliere il commento
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  web:
    build: ./WebApp
    image: platea-web:latest
    container_name: platea-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${PLATEA_WEB_PORT:-8080}:80"
    environment:
      PLATEA_SERVER_URL: http://server:8096

  # Accesso da fuori senza aprire porte: tunnel Cloudflare.
  # Parte solo con il profilo "tunnel" (COMPOSE_PROFILES=tunnel in .env, o docker compose --profile tunnel up -d).
  # Nel pannello Cloudflare (Zero Trust → Networks → Tunnels → Public hostnames):
  #   platea.example.com    →  http://web:80        (web UI)
  #   infuse.example.com    →  http://server:8096   (Infuse e app Jellyfin)
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    container_name: platea-cloudflared
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      - web
      - server
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
